<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}멋쟁이 블로그{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar {
      background-color: #2c3e50;
    }
    .navbar-brand {
      color: white;
      font-weight: bold;
      font-size: 1.4rem;
    }
    .nav-btn {
      margin-left: 10px;
    }
    .center-logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg px-4 d-flex justify-content-between align-items-center position-relative">
    <div>
      <img src="https://i.ibb.co/2Y8Xv5S/logo.png" alt="logo" width="35" height="35">
    </div>
    <div class="center-logo">멋쟁이 블로그</div>
    <div>
      {% if user.is_authenticated %}
        <span class="text-white me-3">안녕하세요, <strong>{{ user.nickname }}</strong>님</span>
        <a class="btn btn-primary btn-sm nav-btn" href="{% url 'logout' %}">로그아웃</a>
      {% else %}
        <a class="btn btn-primary btn-sm nav-btn" href="{% url 'login' %}">로그인</a>
        <a class="btn btn-primary btn-sm nav-btn" href="{% url 'signup' %}">회원가입</a>
      {% endif %}
    </div>
  </nav>

  <div class="container mt-5 text-center">
    {% if user.is_authenticated %}
      <a href="{% url 'product_create' %}" class="btn btn-primary mb-4">+ 새 글 작성</a>
    {% endif %}
    
    {% block content %}
    {% endblock %}
  </div>
</body>
</html>
